services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sabbath_school_reviews
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    ports:
      # Mapeia a porta 5432 do container para a porta 5432
      # apenas na interface localhost (127.0.0.1) do servidor.
      # Isso mantém o banco seguro da internet.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sabbath_school_reviews"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    # A porta não é mais exposta publicamente. Caddy gerencia o acesso.
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    # A porta não é mais exposta publicamente. Caddy gerencia o acesso.
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"   # Porta HTTP para o desafio SSL
      - "443:443" # Porta HTTPS para o site seguro
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config: