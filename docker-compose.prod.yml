services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sabbath_school_reviews
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always
    # ADICIONADO: Verificação de saúde para o banco de dados.
    # Ele verifica se o PostgreSQL está pronto para aceitar conexões.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sabbath_school_reviews"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    # ATUALIZADO: Agora o backend espera o banco de dados estar "saudável".
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}

volumes:
  postgres_data: